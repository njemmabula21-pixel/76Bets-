<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>76Bets - Local Test</title>
    <style>
        body {
            background: #05110a;
            color: #e4f0e8;
            font-family: Arial;
            padding: 1rem;
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        .box { background: #0c1f13; padding: 2rem; border-radius: 8px; border: 1px solid #1a3522; }
        h1 { color: #00ff85; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input { width: 100%; padding: 0.75rem; background: #0c1f13; color: #e4f0e8; border: 1px solid #1a3522; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: none; border-color: #00ff85; }
        button { width: 100%; padding: 0.75rem; background: #00ff85; color: #000; border: none; font-weight: bold; font-size: 1rem; border-radius: 4px; cursor: pointer; margin-bottom: 0.5rem; }
        button:active { opacity: 0.8; }
        .msg { padding: 1rem; border-radius: 4px; margin: 1rem 0; min-height: 2rem; border: 1px solid; }
        .success { background: rgba(0,255,133,0.1); border-color: #00ff85; color: #00ff85; }
        .error { background: rgba(255,68,68,0.1); border-color: #ff4444; color: #ff4444; }
        .info { background: rgba(100,200,200,0.1); border-color: #4db8ac; color: #4db8ac; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>76Bets (Local Test)</h1>
            
            <div id="authForm">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" placeholder="test@example.com">
                </div>
                
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" placeholder="password123">
                </div>
                
                <button onclick="handleSignUp()">Sign Up</button>
                <button onclick="handleSignIn()">Sign In</button>
                
                <div id="msg" class="msg info">Ready to test (no Supabase)</div>
            </div>
            
            <div id="dashboard" style="display:none; text-align: center;">
                <h2 style="color: #00ff85;">Welcome! ✅</h2>
                <p>Logged in as:</p>
                <p id="userEmail" style="color: #4a7a5a; font-weight: bold;"></p>
                <button onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // Simple local storage based auth (no Supabase)
        
        function log(msg, type = 'info') {
            const msgDiv = document.getElementById('msg');
            msgDiv.className = 'msg ' + type;
            msgDiv.textContent = msg;
            console.log(type + ': ' + msg);
        }

        function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                log('❌ Please fill all fields', 'error');
                return;
            }

            if (password.length < 6) {
                log('❌ Password must be 6+ characters', 'error');
                return;
            }

            // Check if account exists
            const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
            if (accounts[email]) {
                log('❌ Email already exists', 'error');
                return;
            }

            // Create account
            accounts[email] = password;
            localStorage.setItem('accounts', JSON.stringify(accounts));
            localStorage.setItem('currentUser', email);

            log('✅ Account created and logged in!', 'success');
            showDashboard(email);
        }

        function handleSignIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                log('❌ Please fill all fields', 'error');
                return;
            }

            const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
            
            if (!accounts[email]) {
                log('❌ Email not found', 'error');
                return;
            }

            if (accounts[email] !== password) {
                log('❌ Wrong password', 'error');
                return;
            }

            localStorage.setItem('currentUser', email);
            log('✅ Signed in successfully!', 'success');
            showDashboard(email);
        }

        function showDashboard(email) {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userEmail').textContent = email;
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            document.getElementById('authForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            log('✅ Logged out', 'success');
        }

        // Check if user already logged in
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                showDashboard(currentUser);
            }
        });
    </script>
</body>
</html>
