<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>76Bets - Test</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #05110a;
            color: #e4f0e8;
            padding: 1rem;
        }

        .card {
            background: #0c1f13;
            border: 1px solid #1a3522;
            padding: 2rem;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 8px;
        }

        h1 {
            color: #00ff85;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #1a3522;
            background: #0c1f13;
            color: #e4f0e8;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #00ff85;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .msg {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            min-height: 2rem;
        }

        .error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .success {
            background: rgba(0, 255, 133, 0.2);
            color: #00ff85;
            border: 1px solid #00ff85;
        }

        .info {
            background: rgba(100, 200, 200, 0.2);
            color: #4db8ac;
            border: 1px solid #4db8ac;
        }

        #dashboard {
            display: none;
            text-align: center;
        }

        #dashboard h2 {
            color: #00ff85;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>76Bets - Test</h1>

        <div id="authSection">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="test@example.com">
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="password123">
            </div>

            <button onclick="testClick()">🧪 TEST CLICK</button>
            <button onclick="handleSignUp()">Sign Up</button>
            <button onclick="handleSignIn()">Sign In</button>

            <div class="msg info" id="status">Ready...</div>
        </div>

        <div id="dashboard">
            <h2>Welcome! ✅</h2>
            <p id="userEmail"></p>
            <button onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wexldumfmwpyisuudjce.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JtrlRlf35bMovhVHVVKs5A_IISU06Ko';

        let supabase = null;

        // INIT
        async function init() {
            try {
                const { createClient } = window.supabase;
                supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
                log('Supabase initialized', 'info');

                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) {
                    showDashboard(session.user);
                }
            } catch (err) {
                log('Init error: ' + err.message, 'error');
            }
        }

        // LOG MESSAGE
        function log(msg, type = 'info') {
            const status = document.getElementById('status');
            status.className = 'msg ' + type;
            status.textContent = msg;
            console.log(type + ': ' + msg);
        }

        // TEST CLICK
        function testClick() {
            alert('✅ Button is working!');
            log('Button click works!', 'success');
        }

        // SIGN UP
        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                log('Fill in all fields', 'error');
                return;
            }

            log('Creating account...', 'info');

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password
                });

                if (error) throw new Error(error.message);

                log('Account created! Email: ' + email, 'success');

                // Create profile
                if (data.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert({
                            id: data.user.id,
                            bankroll: 0,
                            currency: 'TZS'
                        });

                    if (!profileError) {
                        log('Profile created', 'success');
                    }

                    // Auto sign in
                    const { data: signinData, error: signinError } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (!signinError && signinData.user) {
                        showDashboard(signinData.user);
                    }
                }
            } catch (err) {
                log('Signup error: ' + err.message, 'error');
            }
        }

        // SIGN IN
        async function handleSignIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                log('Fill in all fields', 'error');
                return;
            }

            log('Signing in...', 'info');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw new Error(error.message);

                if (data.user) {
                    log('Signed in!', 'success');
                    showDashboard(data.user);
                }
            } catch (err) {
                log('Signin error: ' + err.message, 'error');
            }
        }

        // SHOW DASHBOARD
        function showDashboard(user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userEmail').textContent = 'Logged in as: ' + user.email;
        }

        // LOGOUT
        async function handleLogout() {
            try {
                await supabase.auth.signOut();
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                log('Logged out', 'success');
            } catch (err) {
                log('Logout error: ' + err.message, 'error');
            }
        }

        // RUN
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
