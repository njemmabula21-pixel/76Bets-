<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>76Bets - Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05110a;
            color: #e4f0e8;
            font-family: Arial, sans-serif;
            padding-bottom: 80px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* ── HEADER ── */
        .header {
            background: #0c1f13;
            border-bottom: 1px solid #1a3522;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #00ff85;
            font-size: 1.5rem;
        }

        .logout-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* ── AUTH FORM ── */
        .auth-form {
            background: #0c1f13;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #1a3522;
        }

        .auth-form h1 {
            color: #00ff85;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #0c1f13;
            color: #e4f0e8;
            border: 1px solid #1a3522;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #00ff85;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #00ff85;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }

        button:active {
            opacity: 0.8;
        }

        /* ── CARD ── */
        .card {
            background: #0c1f13;
            border: 1px solid #1a3522;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 0.875rem;
            color: #4a7a5a;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 1.75rem;
            color: #00ff85;
            font-weight: bold;
        }

        /* ── STATS GRID ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: #0c1f13;
            border: 1px solid #1a3522;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #4a7a5a;
            margin-bottom: 0.5rem;
        }

        .stat-number {
            font-size: 1.5rem;
            color: #00ff85;
            font-weight: bold;
        }

        .stat-card.negative .stat-number {
            color: #ff4444;
        }

        /* ── TAB NAVIGATION ── */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #1a3522;
            overflow-x: auto;
        }

        .tab-btn {
            flex-shrink: 0;
            padding: 0.75rem;
            background: none;
            border: none;
            color: #4a7a5a;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            color: #00ff85;
            border-bottom-color: #00ff85;
        }

        /* ── BET HISTORY ── */
        .bet-card {
            background: #0c1f13;
            border: 1px solid #1a3522;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .bet-date {
            font-size: 0.75rem;
            color: #4a7a5a;
        }

        .bet-status {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            background: #1a3522;
            color: #4a7a5a;
        }

        .bet-status.pending {
            background: rgba(100, 200, 200, 0.2);
            color: #4db8ac;
        }

        .bet-status.won {
            background: rgba(0, 255, 133, 0.2);
            color: #00ff85;
        }

        .bet-status.lost {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .bet-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
        }

        .detail {
            background: #1a3522;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .detail-label {
            font-size: 0.7rem;
            color: #4a7a5a;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-weight: bold;
            color: #00ff85;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #4a7a5a;
        }

        /* ── TAB CONTENT ── */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0c1f13;
            border-top: 1px solid #1a3522;
            display: flex;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .nav-item {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            color: #4a7a5a;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .nav-item.active {
            color: #00ff85;
        }

        .performance-chart {
            background: #1a3522;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .chart-label {
            width: 60px;
            font-size: 0.85rem;
            color: #4a7a5a;
        }

        .chart-fill {
            flex: 1;
            height: 25px;
            background: #00ff85;
            border-radius: 4px;
            position: relative;
        }

        .chart-fill.loss {
            background: #ff4444;
        }

        .chart-value {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 0.85rem;
            color: #000;
        }

        .stats-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-card-3 {
            background: #0c1f13;
            border: 1px solid #1a3522;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label-3 {
            font-size: 0.75rem;
            color: #4a7a5a;
            margin-bottom: 0.5rem;
        }

        .stat-number-3 {
            font-size: 1.3rem;
            color: #00ff85;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- AUTH FORM -->
        <div id="authSection" class="auth-form">
            <h1>76Bets</h1>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="test@example.com">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="password123">
            </div>
            <button onclick="handleSignUp()">Sign Up</button>
            <button onclick="handleSignIn()">Sign In</button>
        </div>

        <!-- APP SECTION -->
        <div id="appSection" style="display: none;">
            <div class="header">
                <h1>76Bets</h1>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>

            <!-- HOME TAB -->
            <div id="homeTab" class="tab-content active">
                <div class="card">
                    <div class="card-title">💰 Current Bankroll</div>
                    <div class="card-value" id="bankroll">TZS 5,000</div>
                </div>
                <div class="stats-grid-3">
                    <div class="stat-card-3">
                        <div class="stat-label-3">Win Rate</div>
                        <div class="stat-number-3" id="winRate">0%</div>
                    </div>
                    <div class="stat-card-3">
                        <div class="stat-label-3">Total Bets</div>
                        <div class="stat-number-3" id="totalBets">0</div>
                    </div>
                    <div class="stat-card-3">
                        <div class="stat-label-3">ROI</div>
                        <div class="stat-number-3" id="roi">0%</div>
                    </div>
                </div>
            </div>

            <!-- REPORTS TAB -->
            <div id="reportsTab" class="tab-content">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchReportTab('overview')">📊 Overview</button>
                    <button class="tab-btn" onclick="switchReportTab('history')">📋 History</button>
                </div>

                <!-- OVERVIEW -->
                <div id="overviewTab" class="tab-content active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Bets</div>
                            <div class="stat-number" id="totalBetsOverview">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Wins</div>
                            <div class="stat-number" id="winsOverview">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Losses</div>
                            <div class="stat-card negative">
                                <div class="stat-number" id="lossesOverview">0</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Win %</div>
                            <div class="stat-number" id="winRateOverview">0%</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">💵 Financial Summary</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div>
                                <div style="font-size: 0.75rem; color: #4a7a5a; margin-bottom: 0.5rem;">Total Staked</div>
                                <div style="font-size: 1.3rem; color: #00ff85; font-weight: bold;" id="totalStaked">TZS 0</div>
                            </div>
                            <div>
                                <div style="font-size: 0.75rem; color: #4a7a5a; margin-bottom: 0.5rem;">Total Won</div>
                                <div style="font-size: 1.3rem; color: #00ff85; font-weight: bold;" id="totalWon">TZS 0</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">📈 Performance</div>
                        <div class="performance-chart">
                            <div class="chart-bar">
                                <div class="chart-label">Wins</div>
                                <div class="chart-fill" id="winsBar" style="width: 0%;">
                                    <div class="chart-value" id="winsValue">0</div>
                                </div>
                            </div>
                            <div class="chart-bar">
                                <div class="chart-label">Losses</div>
                                <div class="chart-fill loss" id="lossesBar" style="width: 0%;">
                                    <div class="chart-value" id="lossesValue">0</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- HISTORY -->
                <div id="historyTab" class="tab-content">
                    <div class="tabs" style="border: none; margin-bottom: 0.5rem;">
                        <button class="tab-btn active" onclick="filterBets('all')">All</button>
                        <button class="tab-btn" onclick="filterBets('pending')">⏳ Pending</button>
                        <button class="tab-btn" onclick="filterBets('won')">✅ Won</button>
                        <button class="tab-btn" onclick="filterBets('lost')">❌ Lost</button>
                    </div>

                    <div id="betsList">
                        <div class="empty-state">No bets yet. Start betting!</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <button class="nav-item active" onclick="switchPage('home')">🏠 Home</button>
        <button class="nav-item" onclick="switchPage('fixtures')">📋 Fixtures</button>
        <button class="nav-item" onclick="switchPage('betslip')">🎯 Betslip</button>
        <button class="nav-item" onclick="switchPage('reports')">📊 Reports</button>
        <button class="nav-item" onclick="switchPage('settings')">⚙️ Settings</button>
    </div>

    <script>
        let currentUser = null;
        let currentFilter = 'all';

        function getAccountData(email) {
            const data = JSON.parse(localStorage.getItem('userdata:' + email) || '{}');
            return {
                bankroll: data.bankroll || 5000,
                wins: data.wins || 0,
                losses: data.losses || 0,
                totalBets: data.totalBets || 0,
                profit: data.profit || 0
            };
        }

        function saveAccountData(email, data) {
            localStorage.setItem('userdata:' + email, JSON.stringify(data));
        }

        function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('❌ Fill all fields');
                return;
            }

            if (password.length < 6) {
                alert('❌ Password 6+ characters');
                return;
            }

            const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
            if (accounts[email]) {
                alert('❌ Email already exists');
                return;
            }

            accounts[email] = password;
            localStorage.setItem('accounts', JSON.stringify(accounts));
            localStorage.setItem('currentUser', email);

            saveAccountData(email, { bankroll: 5000 });
            showApp(email);
        }

        function handleSignIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('❌ Fill all fields');
                return;
            }

            const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');

            if (!accounts[email]) {
                alert('❌ Email not found');
                return;
            }

            if (accounts[email] !== password) {
                alert('❌ Wrong password');
                return;
            }

            localStorage.setItem('currentUser', email);
            showApp(email);
        }

        function showApp(email) {
            currentUser = email;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';

            loadUserData();
        }

        function loadUserData() {
            const data = getAccountData(currentUser);
            document.getElementById('bankroll').textContent = 'TZS ' + data.bankroll.toLocaleString();
            
            const winRate = data.totalBets > 0 ? Math.round((data.wins / data.totalBets) * 100) : 0;
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('totalBets').textContent = data.totalBets;
            
            const roi = data.bankroll > 5000 
                ? Math.round(((data.bankroll - 5000) / 5000) * 100) 
                : Math.round(((data.bankroll - 5000) / 5000) * 100);
            document.getElementById('roi').textContent = roi + '%';

            updateReports();
        }

        function updateReports() {
            const bets = JSON.parse(localStorage.getItem('bets:' + currentUser) || '[]');
            const data = getAccountData(currentUser);

            // Overview stats
            document.getElementById('totalBetsOverview').textContent = bets.length;
            document.getElementById('winsOverview').textContent = data.wins;
            document.getElementById('lossesOverview').textContent = data.losses;
            
            const winRate = bets.length > 0 ? Math.round((data.wins / bets.length) * 100) : 0;
            document.getElementById('winRateOverview').textContent = winRate + '%';

            // Financial
            const totalStaked = bets.reduce((sum, b) => sum + b.stake, 0);
            const totalWon = bets.filter(b => b.status === 'Won').reduce((sum, b) => sum + b.potential, 0);
            
            document.getElementById('totalStaked').textContent = 'TZS ' + totalStaked.toLocaleString();
            document.getElementById('totalWon').textContent = 'TZS ' + totalWon.toLocaleString();

            // Charts
            const maxBets = Math.max(data.wins, data.losses, 1);
            const winsPercent = (data.wins / maxBets) * 100;
            const lossesPercent = (data.losses / maxBets) * 100;

            document.getElementById('winsBar').style.width = winsPercent + '%';
            document.getElementById('lossesBar').style.width = lossesPercent + '%';
            document.getElementById('winsValue').textContent = data.wins;
            document.getElementById('lossesValue').textContent = data.losses;

            // Bets list
            renderBets(bets);
        }

        function renderBets(bets) {
            const filtered = bets.filter(b => {
                if (currentFilter === 'all') return true;
                return b.status.toLowerCase() === currentFilter;
            });

            if (filtered.length === 0) {
                document.getElementById('betsList').innerHTML = '<div class="empty-state">No bets found.</div>';
                return;
            }

            let html = '';
            filtered.reverse().forEach((bet, idx) => {
                const statusClass = bet.status.toLowerCase();
                const statusEmoji = statusClass === 'won' ? '✅' : statusClass === 'lost' ? '❌' : '⏳';
                
                html += `
                    <div class="bet-card">
                        <div class="bet-header">
                            <div class="bet-date">${bet.date}</div>
                            <div class="bet-status ${statusClass}">${statusEmoji} ${bet.status}</div>
                        </div>
                        <div class="bet-details">
                            <div class="detail">
                                <div class="detail-label">Selections</div>
                                <div class="detail-value">${bet.selections}</div>
                            </div>
                            <div class="detail">
                                <div class="detail-label">Odds</div>
                                <div class="detail-value">${bet.odds}</div>
                            </div>
                            <div class="detail">
                                <div class="detail-label">Stake</div>
                                <div class="detail-value">TZS ${bet.stake.toLocaleString()}</div>
                            </div>
                            <div class="detail">
                                <div class="detail-label">Potential</div>
                                <div class="detail-value">TZS ${bet.potential.toLocaleString()}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('betsList').innerHTML = html;
        }

        function filterBets(filter) {
            currentFilter = filter;
            document.querySelectorAll('#historyTab .tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const bets = JSON.parse(localStorage.getItem('bets:' + currentUser) || '[]');
            renderBets(bets);
        }

        function switchReportTab(tab) {
            document.querySelectorAll('#reportsTab .tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('#reportsTab > .tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'overview') {
                document.getElementById('overviewTab').classList.add('active');
                document.querySelectorAll('#reportsTab > .tabs .tab-btn')[0].classList.add('active');
            } else if (tab === 'history') {
                document.getElementById('historyTab').classList.add('active');
                document.querySelectorAll('#reportsTab > .tabs .tab-btn')[1].classList.add('active');
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if (page === 'home') {
                document.getElementById('homeTab').classList.add('active');
            } else if (page === 'reports') {
                document.getElementById('reportsTab').classList.add('active');
            }
            
            event.target.classList.add('active');
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('bottomNav').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        window.addEventListener('DOMContentLoaded', function() {
            const currentUserStored = localStorage.getItem('currentUser');
            if (currentUserStored) {
                showApp(currentUserStored);
            }
        });
    </script>
</body>
</html>
